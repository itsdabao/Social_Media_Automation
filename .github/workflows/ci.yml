name: CI

on:
  push:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository-checks:
    name: Repository checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      HUSKY: "0"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Use pinned npm version
        run: npm install --global npm@11.21.1 --ignore-scripts
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Check formatting
        run: npm run format:check
      - name: Lint tooling code
        run: npm run lint
      - name: Test Git hook safeguards
        run: npm run test:tooling
      - name: Test TypeScript configuration
        run: npm run test:typescript-config
      - name: Verify public contracts
        run: npm run check:contracts
      - name: Verify API
        run: npm run check:api
      - name: Verify web
        run: npm run check:web
